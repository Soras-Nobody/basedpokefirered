name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: FIRERED
      GAME_LANGUAGE: ENGLISH
      GAME_REVISION: 0
      MODERN: 1
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Checkout agbcc
        uses: actions/checkout@master
        with:
          path: 'agbcc'
          repository: 'pret/agbcc'

      - name: Install binutils
        run: |
          sudo apt update
          sudo apt install gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev
        # build-essential and git are already installed
        # gcc-arm-none-eabi is needed for the modern build

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: ./agbcc

      - name: Build Based FireRed
        run: |
          make -j$(nproc)

      - name: Build Based FireRed Rev1
        env:
          GAME_REVISION: 1
        run: |
          make -j$(nproc)

      - name: Build Based FireRed Switch
        env:
          GAME_REVISION: 10
        run: |
          make -j$(nproc)

      - name: Build Based LeafGreen
        env:
          GAME_VERSION: LEAFGREEN
        run: |
          make -j$(nproc)

      - name: Build Based LeafGreen Rev1
        env:
          GAME_VERSION: LEAFGREEN
          GAME_REVISION: 1
        run: |
          make -j$(nproc)

      - name: Build Based LeafGreen Switch
        env:
          GAME_VERSION: LEAFGREEN
          GAME_REVISION: 10
        run: |
          make -j$(nproc)

      - name: Build Based FireRed Classic
        env:
          MODERN: 0
        run: |
          make -j$(nproc)

      - name: Build Based FireRed Rev1 Classic
        env:
          GAME_REVISION: 1
          MODERN: 0
        run: |
          make -j$(nproc)

      - name: Build Based FireRed Switch Classic
        env:
          GAME_REVISION: 10
          MODERN: 0
        run: |
          make -j$(nproc)

      - name: Build Based LeafGreen Classic
        env:
          GAME_VERSION: LEAFGREEN
          MODERN: 0
        run: |
          make -j$(nproc)

      - name: Build Based LeafGreen Rev1 Classic
        env:
          GAME_VERSION: LEAFGREEN
          GAME_REVISION: 1
          MODERN: 0
        run: |
          make -j$(nproc)

      - name: Build Based LeafGreen Switch Classic
        env:
          GAME_VERSION: LEAFGREEN
          GAME_REVISION: 10
          MODERN: 0
        run: |
          make -j$(nproc)
